services:
  mysql:
    image: mysql:8.0
    container_name: billpilot_mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
      --max_allowed_packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billpilot
      MYSQL_USER: billpilot
      MYSQL_PASSWORD: billpilot
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'billpilot', '-pbillpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: billpilot_mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mysqldata:
