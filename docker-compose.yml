services:
  postgres:
    image: postgres:16
    container_name: billpilot_postgres
    environment:
      POSTGRES_USER: billpilot
      POSTGRES_PASSWORD: billpilot
      POSTGRES_DB: billpilot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: billpilot_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: billpilot_mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
